<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>厚德高熊 · 刷题</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2329;--muted:#7b8493;--line:#e7e9ee;--accent:#1677ff;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:720px;margin:auto;padding:14px 12px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.title{font-size:21px;font-weight:800}
.muted{color:var(--muted);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#f7f8fa;border-radius:14px;padding:14px 6px;text-align:center}
.stat b{font-size:24px;display:block}
.menu{display:grid;gap:10px}
.menu button{text-align:left}
button{min-height:46px;border:0;border-radius:13px;padding:12px 15px;font-size:16px;font-weight:700}
.primary{background:var(--accent);color:white}
.secondary{background:#eef0f3;color:#2f3540}
.menuBtn{background:white;border:1px solid var(--line);color:var(--text)}
.menuBtn small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
.hidden{display:none!important}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.progress{height:8px;border-radius:99px;background:#eceff3;overflow:hidden;margin:11px 0 16px}
.progress div{height:100%;background:var(--accent);width:0}
.q{font-size:19px;line-height:1.6;font-weight:750;margin:8px 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0;background:white}
.opt input{margin-top:4px;transform:scale(1.2)}
.opt.correct{border-color:#86efac;background:#f0fdf4}
.opt.wrong{border-color:#fca5a5;background:#fef2f2}
.key{font-weight:800;min-width:22px}
.feedback{margin-top:12px;padding:12px 14px;border-radius:13px;line-height:1.65}
.feedback.bad{background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.actions button{flex:1;min-width:120px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">厚德高熊 · 刷题</div>
    <div class="muted">共 113 题</div>
  </div>

  <section id="home" class="card">
    <div class="stats">
      <div class="stat"><b id="doneCount">0</b><span>已做</span></div>
      <div class="stat"><b id="wrongCount">0</b><span>错题</span></div>
      <div class="stat"><b id="accuracy">0%</b><span>正确率</span></div>
    </div>
    <div class="menu">
      <button class="menuBtn" data-mode="all">▶ 顺序练习<small>从上次进度继续顺序练习</small></button>
      <button class="menuBtn" data-mode="random">🔀 随机练习<small>随机顺序也会保存进度</small></button>
      <button class="menuBtn" data-mode="wrong">✖ 错题重练<small>错题练习也会保存进度</small></button>
      <button class="secondary" id="resetBtn">清空答题记录</button>
    </div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="meta"><span id="pos"></span><span id="typeText"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <div id="qtext" class="q"></div>
    <form id="options"></form>
    <div id="feedback" class="feedback bad hidden" aria-live="polite"></div>
    <div class="actions">
      <button id="prevBtn" class="secondary" type="button">上一题</button>
      <button id="homeBtn" class="secondary" type="button">返回首页</button>
      <button id="submitBtn" class="primary" type="button">提交答案</button>
      <button id="nextBtn" class="primary hidden" type="button">下一题</button>
    </div>
  </section>

  <section id="result" class="card hidden">
    <div class="q">本轮完成</div>
    <div id="resultText" style="line-height:1.8"></div>
    <div class="actions"><button id="resultHome" class="primary">返回首页</button></div>
  </section>

  <div class="note">退出后自动保存进度；下次打开从上次位置继续。答对自动下一题，答错显示正确答案，可随时点“上一题”。</div>
</div>

const STORE_KEY = "hdgx_quiz_v4";
let saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{"done":{},"wrong":[],"progress":{"all":0,"random":0,"wrong":0},"randomOrder":[]}');
if(!saved.progress) saved.progress={all:0,random:0,wrong:0};
if(!saved.randomOrder) saved.randomOrder=[];
let queue = [];
let idx = 0;
let currentMode = "all";
let submitted = false;
let roundDone = 0;
let roundCorrect = 0;
const $ = s => document.querySelector(s);

function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(saved)); }
function show(id){ ["home","quiz","result"].forEach(x => $("#"+x).classList.toggle("hidden", x!==id)); }
function updateHome(){
  const vals = Object.values(saved.done);
  const correct = vals.filter(Boolean).length;
  $("#doneCount").textContent = vals.length;
  $("#wrongCount").textContent = saved.wrong.length;
  $("#accuracy").textContent = vals.length ? Math.round(correct/vals.length*100)+"%" : "0%";
}

function start(mode){
  currentMode = mode;
  if(mode==="wrong"){
    queue = QUESTIONS.filter(q => saved.wrong.includes(q.id));
    if(!queue.length){ alert("目前还没有错题。"); return; }
    idx = Math.min(saved.progress.wrong || 0, Math.max(queue.length-1,0));
  } else if(mode==="random"){
    if(!saved.randomOrder.length){
      const ids = QUESTIONS.map(q=>q.id);
      for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
      saved.randomOrder = ids;
      saved.progress.random = 0;
      persist();
    }
    queue = saved.randomOrder.map(id => QUESTIONS.find(q=>q.id===id)).filter(Boolean);
    idx = Math.min(saved.progress.random || 0, Math.max(queue.length-1,0));
  } else {
    queue = [...QUESTIONS];
    idx = Math.min(saved.progress.all || 0, Math.max(queue.length-1,0));
  }
  roundDone = 0; roundCorrect = 0;
  show("quiz"); render();
}
function render(){
  if(idx >= queue.length){ finish(); return; }
  submitted = false;
  const q = queue[idx];
  $("#pos").textContent = `第 ${idx+1} / ${queue.length} 题`;
  $("#typeText").textContent = q.type==="single" ? "单选题" : "多选题";
  $("#bar").style.width = ((idx)/queue.length*100) + "%";
  $("#qtext").textContent = q.id + ". " + q.question;
  $("#feedback").classList.add("hidden");
  $("#feedback").textContent = "";
  $("#submitBtn").classList.remove("hidden");
  $("#nextBtn").classList.add("hidden");
  $("#prevBtn").disabled = idx===0;

  const box = $("#options");
  box.innerHTML = "";
  q.options.forEach(o => {
    const label = document.createElement("label");
    label.className = "opt";
    const input = document.createElement("input");
    input.type = q.type==="single" ? "radio" : "checkbox";
    input.name = "answer";
    input.value = o.key;
    const key = document.createElement("span");
    key.className = "key"; key.textContent = o.key + ".";
    const txt = document.createElement("span");
    txt.textContent = o.text;
    label.append(input,key,txt);
    box.appendChild(label);
  });
}

function submit(){
  if(submitted) return;
  const q = queue[idx];
  const selected = [...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value).sort();
  if(!selected.length){ alert("请先选择答案。"); return; }

  const ans = [...q.answer].sort();
  const ok = selected.join("") === ans.join("");
  submitted = true;
  roundDone++;
  if(ok) roundCorrect++;

  saved.done[q.id] = ok;
  saved.progress[currentMode] = idx;
  if(ok){
    saved.wrong = saved.wrong.filter(id => id !== q.id);
  } else if(!saved.wrong.includes(q.id)){
    saved.wrong.push(q.id);
  }
  persist();

  if(ok){
    idx++;
    saved.progress[currentMode] = idx;
    persist();
    setTimeout(render, 80);
    return;
  }

  // 答错：停留在当前题，显示正确答案
  document.querySelectorAll(".opt").forEach(label => {
    const input = label.querySelector("input");
    input.disabled = true;
    if(ans.includes(input.value)) label.classList.add("correct");
    if(selected.includes(input.value) && !ans.includes(input.value)) label.classList.add("wrong");
  });

  const fb = $("#feedback");
  fb.innerHTML = `❌ 回答错误<br>正确答案：<b>${ans.join("、")}</b><br>你的答案：${selected.join("、")}`;
  fb.classList.remove("hidden");
  $("#submitBtn").classList.add("hidden");
  $("#nextBtn").classList.remove("hidden");
}

function next(){
  idx++;
  saved.progress[currentMode] = idx;
  persist();
  render();
}
function prev(){
  if(idx <= 0) return;
  idx--;
  saved.progress[currentMode] = idx;
  persist();
  render();
}
function finish(){
  saved.progress[currentMode] = 0;
  if(currentMode==="random") saved.randomOrder = [];
  persist();
  show("result");
  const pct = roundDone ? Math.round(roundCorrect/roundDone*100) : 0;
  $("#resultText").innerHTML = `本轮共答 <b>${roundDone}</b> 题，答对 <b>${roundCorrect}</b> 题，正确率 <b>${pct}%</b>。<br>当前错题本共 <b>${saved.wrong.length}</b> 题。`;
  updateHome();
}

document.querySelectorAll("[data-mode]").forEach(btn => btn.addEventListener("click",()=>start(btn.dataset.mode)));
$("#submitBtn").addEventListener("click", submit);
$("#nextBtn").addEventListener("click", next);
$("#prevBtn").addEventListener("click", prev);
$("#homeBtn").addEventListener("click", ()=>{ show("home"); updateHome(); });
$("#resultHome").addEventListener("click", ()=>{ show("home"); updateHome(); });
$("#resetBtn").addEventListener("click", ()=>{
  if(confirm("确定清空全部答题记录和错题吗？")){
    saved = {done:{},wrong:[],progress:{all:0,random:0,wrong:0},randomOrder:[]};
    persist();
    updateHome();
  }
});
updateHome();
</script>
</body>
</html>
